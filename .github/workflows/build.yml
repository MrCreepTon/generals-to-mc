name: Build mod

on:
  push:
    branches: [main, 'mc/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      minecraft:
        description: 'Verified Minecraft profile (or all)'
        default: 'all'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: versions
        shell: bash
        env:
          MINECRAFT_TARGET: ${{ inputs.minecraft || 'all' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python tools/build.py validate-tag --tag "$GITHUB_REF_NAME"
            MINECRAFT_TARGET=all
          fi
          python tools/ci_versions.py --target "$MINECRAFT_TARGET" >> "$GITHUB_OUTPUT"

  native:
    needs: versions
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Build pinned engine without retail files
        shell: pwsh
        run: ./Build-Native.ps1 -NoStage -NativeRoot (Join-Path $env:RUNNER_TEMP 'generals-native')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-built-engine
          path: build/native/windows-x86/generalszh.exe
          if-no-files-found: error
          retention-days: 7

  mod:
    needs: [versions, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: source-built-engine
          path: build/native/windows-x86
      - name: Build, test and audit release JAR
        shell: bash
        env:
          MINECRAFT_TARGET: ${{ matrix.minecraft }}
        run: make build MC="$MINECRAFT_TARGET" NATIVE_BIN=build/native/windows-x86/generalszh.exe
      - name: Upload mod and corresponding source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generals-minecraft-mc${{ matrix.minecraft }}
          path: build/release/player/${{ matrix.minecraft }}/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [versions, mod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: generals-minecraft-mc*
          path: build/artifacts
      - name: Prepare draft release with every JAR and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/draft_release.py --tag "$RELEASE_TAG"
