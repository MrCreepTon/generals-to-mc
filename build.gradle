plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def target = providers.gradleProperty('minecraft_target').get()
def profileFile = file(findProperty('version_profile') ?: "versions/${target}.properties")
if (!profileFile.isFile()) throw new GradleException("Unsupported Minecraft target: ${target}; add and verify a versions profile first")
def profile = new Properties()
profileFile.withInputStream { profile.load(it) }
def unobfuscated = profile.getProperty('unobfuscated','false').toBoolean()
ext.minecraftUnobfuscated=unobfuscated
ext.minecraftJavaVersion=profile.java.toInteger()
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
version = "${mod_version}+mc${profile.minecraft}"
group = 'local.generalsmc'
base { archivesName = 'generals-minecraft' }
loom {
    splitEnvironmentSourceSets()
    mods { generalsmc { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft "com.mojang:minecraft:${profile.minecraft}"
    if (!unobfuscated) mappings loom.officialMojangMappings()
    add(unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc:fabric-loader:${profile.loader}")
    add(unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc.fabric-api:fabric-api:${profile.fabric_api}")
    include "net.fabricmc.fabric-api:fabric-api:${profile.fabric_api}"
}
sourceSets.test.java.exclude 'local/generalsmc/sim/**'
// Later adapters replace only matching files. Resources follow the same ordering.
def adapters=profile.getProperty('overlays',target).split(',').collect { it.trim() }.findAll { !it.isEmpty() }
if(adapters.any { !(it ==~ /[a-zA-Z0-9._-]+/) }) throw new GradleException('Invalid adapter name in version profile')
['main','client'].each { kind ->
    ['java','resources'].each { type ->
        def roots=[file("src/${kind}/${type}")]+adapters.collect { file("src/versions/${it}/${kind}/${type}") }
        def winners=[:]
        roots.each { root -> fileTree(root).files.each { source ->
            winners[root.toPath().relativize(source.toPath()).toString().replace('\\','/')]=source.canonicalFile
        } }
        def sources=sourceSets[kind][type]
        sources.setSrcDirs(roots)
        sources.exclude { detail ->
            def winner=winners[detail.relativePath.pathString]
            winner!=null && detail.file.canonicalFile!=winner
        }
    }
}
if(target!='1.21.4')sourceSets.client.java.exclude { it.file.name.contains('Bench') && !it.file.name.startsWith('NativeVersion') }
tasks.withType(JavaCompile).configureEach { options.release = profile.java.toInteger(); options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.toVersion(profile.java); targetCompatibility = JavaVersion.toVersion(profile.java) }

def nativeBinary = providers.gradleProperty('nativeBinary').map { file(it) }.orElse(layout.buildDirectory.file('native/windows-x86/generalszh.exe').map { it.asFile })
def bundled = layout.buildDirectory.dir('generated/nativeResources')
tasks.register('bundleNative') {
    inputs.file(nativeBinary)
    outputs.dir(bundled)
    doLast {
        def exe = nativeBinary.get()
        if (!exe.isFile()) throw new GradleException('Build the engine first: Build-Native.ps1 -NoStage, or supply -PnativeBinary=/path/to/source-built/generalszh.exe')
        def destination = bundled.get().dir('generalsmc/runtime/windows-x86').asFile
        destination.mkdirs()
        copy { from exe; into destination; rename { 'generalszh.exe' } }
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(exe.bytes).encodeHex().toString()
        new File(destination,'runtime.properties').text = "sha256=${sha}\nsourceRevision=f746af7e626c96e693cb74a032da47a602c1a039\nplatform=windows-x86\n"
    }
}
processResources {
    dependsOn 'bundleNative'
    inputs.properties(version: project.version, minecraft: profile.minecraft, loader: profile.loader, java: profile.java)
    from(bundled)
    filesMatching('fabric.mod.json') { expand(version: project.version, minecraft: profile.minecraft, loader: profile.loader, java: profile.java) }
}
tasks.named('jar') {
    exclude '**/*Bench*.class'
}
tasks.register('releaseChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'local.generalsmc.release.ReleaseChecks'
}
tasks.named('test') { enabled = false }
tasks.named('check') { dependsOn 'releaseChecks' }
tasks.register('verifyRelease', Exec) {
    dependsOn 'build'
    commandLine(providers.environmentVariable('PYTHON').getOrElse('python'), '-X', 'utf8', 'tools/check_release.py', tasks.named(unobfuscated?'jar':'remapJar').get().archiveFile.get().asFile.absolutePath)
}
tasks.register('releaseSources', Zip) {
    from('tools') { include 'native_pointer_bench.py','native_path_budget_bench.py','native_material_bench.py','native_ai_bench.py','native_group_bench.py','native_lockstep_bench.py','native_retry_bench.py','native_feedback_bench.py','verify_native_patch.py'; into 'tools' }
    archiveFileName = "generals-minecraft-${project.version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('release')
    from('.') { include 'src/**','native/**','tools/prepare_engine.py','tools/stage_native.py','tools/patch*.py','tools/check_release.py','tools/draft_release.py','tools/build.py','tools/ci_versions.py','tools/generate_marker_assets.py','tools/localize_ui.py','tools/ui_translations.json','Build-Native.ps1','gradle/**','gradlew','gradlew.bat','*.gradle','gradle.properties','versions/**','LICENSE.md','LICENSE.ru.md','THIRD_PARTY_NOTICES.md','THIRD_PARTY_NOTICES.ru.md','Makefile','README.md','README.ru.md','CHANGELOG.md','CHANGELOG.ru.md','docs/media/**','docs/DEVELOPMENT.md','docs/DEVELOPMENT.ru.md','docs/INSTALL.md','docs/INSTALL.ru.md','docs/CONTROLS.md','docs/CONTROLS.ru.md','docs/KNOWN_ISSUES.md','docs/KNOWN_ISSUES.ru.md','.github/**','.gitignore','.gitattributes'; exclude '**/__pycache__/**' }
    doLast {
        def source=archiveFile.get().asFile
        def sha=java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
        new File(source.parentFile,source.name+'.sha256').text=sha+'  '+source.name+'\n'
    }
}
tasks.register('stageRelease', Sync) {
    dependsOn 'verifyRelease','releaseSources'
    into layout.buildDirectory.dir("release/player/${target}")
    from(tasks.named(unobfuscated?'jar':'remapJar').get().archiveFile)
    from(tasks.releaseSources.archiveFile)
    from('README.md','README.ru.md','CHANGELOG.md','CHANGELOG.ru.md','LICENSE.md','LICENSE.ru.md','THIRD_PARTY_NOTICES.md','THIRD_PARTY_NOTICES.ru.md')
    from('docs') { include 'media/**','INSTALL.md','INSTALL.ru.md','CONTROLS.md','CONTROLS.ru.md','KNOWN_ISSUES.md','KNOWN_ISSUES.ru.md','DEVELOPMENT.md','DEVELOPMENT.ru.md'; into 'docs' }
    from(layout.buildDirectory.dir('release')) { include "generals-minecraft-${project.version}.jar.sha256","generals-minecraft-${project.version}-source.zip.sha256",'release-audit.json' }
}
apply from: 'gradle/development.gradle'
apply from: 'gradle/production-check.gradle'
